[tool.poetry]
name = "polyfi-ranked"
version = "1.0.0-dev.17"
description = "Windows Wi-Fi preference manager that auto-switches to the highest-priority available network."
authors = ["Inspyre Softworks"]
readme = "README.md"
packages = [{ include = "wifi_pref_manager", from = "src" }]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
]

[tool.poetry.dependencies]
python = "^3.11"
pystray = "^0.19.5"
pillow = "^11.1.0"
speedtest-cli = "^2.1.3"
easy-exit-calls = {version = "^1.0.0.dev1", python = ">=3.12,<4.0"}
inspy-logger = "^3.2.3"
platformdirs = "^4.9.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
pytest-cov = "^7.0.0"
py-spy = "^0.4.2"

[tool.poetry.group.docs.dependencies]
sphinx = ">=7.4,<9.0"
sphinx-rtd-theme = ">=2,<4"
myst-parser = ">=3.0,<5.0"

[tool.poetry.group.packaging.dependencies]
pyinstaller = {version = ">=6,<7", python = ">=3.11,<3.15"}

[tool.poetry.scripts]
polyfi-ranked = "wifi_pref_manager.app:main"
polyfi-ranked-install-task = "wifi_pref_manager.scheduler:main"
polyfi-ranked-sync-wiki = "scripts.sync_wiki:main"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
