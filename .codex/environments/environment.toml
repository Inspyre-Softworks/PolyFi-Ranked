# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "PolyFi-Ranked"

[setup]
script = ""

[setup.win32]
script = '''
$ErrorActionPreference = 'Stop'

Set-Location $env:CODEX_WORKTREE_PATH

$env:POETRY_VIRTUALENVS_IN_PROJECT = 'true'
$env:POETRY_NO_INTERACTION = '1'

$python = py -3.12 -c "import sys; print(sys.executable)"

& $python -m pip install --upgrade pip
& $python -m pip install --upgrade poetry

poetry env use $python
poetry install --with dev,docs,packaging --no-interaction

poetry run python -m compileall src tests scripts
'''

[cleanup]
script = ""

[cleanup.win32]
script = '''
$ErrorActionPreference = 'Continue'

Set-Location $env:CODEX_WORKTREE_PATH

Remove-Item -Recurse -Force .\.venv -ErrorAction SilentlyContinue
Remove-Item -Recurse -Force .\.pytest_cache -ErrorAction SilentlyContinue
Remove-Item -Recurse -Force .\.mypy_cache -ErrorAction SilentlyContinue
Remove-Item -Recurse -Force .\.ruff_cache -ErrorAction SilentlyContinue
Remove-Item -Recurse -Force .\htmlcov -ErrorAction SilentlyContinue
Remove-Item -Recurse -Force .\dist -ErrorAction SilentlyContinue
Remove-Item -Recurse -Force .\build -ErrorAction SilentlyContinue
Remove-Item -Recurse -Force .\docs\_build -ErrorAction SilentlyContinue
Remove-Item -Force .\.coverage -ErrorAction SilentlyContinue
Remove-Item -Force .\coverage.xml -ErrorAction SilentlyContinue
Remove-Item -Force .\poetry.lock -ErrorAction SilentlyContinue

Get-ChildItem -Recurse -Force -Directory -Filter __pycache__ |
    Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
'''

[[actions]]
name = "Run Tests"
icon = "test"
command = "poetry run pytest"
platform = "win32"

[[actions]]
name = "Build Docs"
icon = "tool"
command = "poetry run sphinx-build -W -b html docs docs/_build/local-html"
platform = "win32"

[[actions]]
name = "Build Package"
icon = "tool"
command = "poetry build"
platform = "win32"

[[actions]]
name = "Check App"
icon = "debug"
command = '''
poetry run polyfi-ranked --version
poetry run polyfi-ranked paths
'''
platform = "win32"
