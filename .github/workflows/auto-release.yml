name: Auto-release on version bump

# Fires on every push to main. Reads the version from pyproject.toml and
# compares it to the previous commit. When the version has been incremented
# AND no matching tag already exists, the workflow:
#   1. Builds the Python wheel and source distribution.
#   2. Publishes prerelease versions to TestPyPI, stable versions to PyPI.
#   3. Creates the v<version> git tag and a GitHub Release with the built
#      distributions and Windows release artifacts attached.
#
# Trusted publishing must be configured in both PyPI and TestPyPI for this
# repository's auto-release.yml workflow.

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  detect-version-bump:
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.check.outputs.bumped }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      prerelease: ${{ steps.check.outputs.prerelease }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packaging helper
        run: python -m pip install packaging

      - name: Detect version bump and tag availability
        id: check
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import tomllib
          from pathlib import Path
          from packaging.version import Version


          def read_version(text: str) -> str:
              return tomllib.loads(text)['tool']['poetry']['version']


          current = read_version(Path('pyproject.toml').read_text(encoding='utf-8'))

          before_sha = os.environ.get('BEFORE_SHA', '')
          zero_sha = '0' * 40
          if not before_sha or before_sha == zero_sha:
              # First push to this branch — no base commit to compare against.
              print('No base commit available; skipping version-bump check.')
              with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as out:
                  out.write('bumped=false\n')
              sys.exit(0)

          prev = subprocess.run(
              ['git', 'show', f'{before_sha}:pyproject.toml'],
              capture_output=True,
              text=True,
          )
          if prev.returncode != 0:
              # pyproject.toml didn't exist at the base commit.
              print('No previous pyproject.toml found; skipping version-bump check.')
              with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as out:
                  out.write('bumped=false\n')
              sys.exit(0)

          previous = read_version(prev.stdout)
          if not (Version(current) > Version(previous)):
              print(f'Version not incremented ({previous} -> {current}); no release needed.')
              with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as out:
                  out.write('bumped=false\n')
              sys.exit(0)

          tag = f'v{current}'

          # Guard against duplicate tags so repeated workflow runs are safe.
          existing = subprocess.run(
              ['git', 'ls-remote', '--tags', 'origin', f'refs/tags/{tag}'],
              capture_output=True,
              text=True,
          )
          if existing.stdout.strip():
              print(f'Tag {tag} already exists on origin; skipping to prevent duplicate release.')
              with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as out:
                  out.write('bumped=false\n')
              sys.exit(0)

          parsed = Version(current)
          prerelease = 'true' if (parsed.is_prerelease or parsed.is_devrelease) else 'false'

          print(f'Version bumped {previous} -> {current}; will release {tag} (prerelease={prerelease}).')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as out:
              out.write('bumped=true\n')
              out.write(f'version={current}\n')
              out.write(f'tag={tag}\n')
              out.write(f'prerelease={prerelease}\n')
          PY

  build-python-distributions:
    needs: detect-version-bump
    if: needs.detect-version-bump.outputs.bumped == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Build Python distributions
        run: poetry build

      - name: Upload Python distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  build-windows-artifacts:
    needs:
      - detect-version-bump
      - build-python-distributions
    if: needs.detect-version-bump.outputs.bumped == 'true'
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Install packaging dependencies
        run: poetry install --with packaging --no-interaction

      - name: Build Windows artifacts
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build_windows_installer.ps1

      - name: Archive the PyInstaller app bundle
        shell: pwsh
        env:
          POLYFI_VERSION: ${{ needs.detect-version-bump.outputs.version }}
        run: |
          $bundleDir = Join-Path $PWD 'dist\pyinstaller\polyfi-ranked'
          $archivePath = Join-Path $PWD "dist\installer\polyfi-ranked-app-$env:POLYFI_VERSION-windows-x64.zip"
          if (Test-Path $archivePath) {
              Remove-Item $archivePath -Force
          }
          Compress-Archive -Path (Join-Path $bundleDir '*') -DestinationPath $archivePath

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: |
            dist/installer/*.exe
            dist/installer/*.zip
          if-no-files-found: error
          retention-days: 30

  publish-package-index:
    needs:
      - detect-version-bump
      - build-python-distributions
    if: needs.detect-version-bump.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download Python distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Publish prerelease distributions to TestPyPI
        if: needs.detect-version-bump.outputs.prerelease == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      - name: Publish stable distributions to PyPI
        if: needs.detect-version-bump.outputs.prerelease != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  publish-github-release:
    needs:
      - detect-version-bump
      - build-python-distributions
      - build-windows-artifacts
      - publish-package-index
    if: needs.detect-version-bump.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create git tag and publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect-version-bump.outputs.tag }}
          name: PolyFi Ranked ${{ needs.detect-version-bump.outputs.version }}
          prerelease: ${{ needs.detect-version-bump.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-assets/*
