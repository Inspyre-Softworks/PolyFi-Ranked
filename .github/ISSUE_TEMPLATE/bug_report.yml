name: Bug Report
description: Report a bug or unexpected behavior in PolyFi: Ranked
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail for us to reproduce it.

        Helpful diagnostics:
        - `poetry run polyfi-ranked paths`
        - relevant log excerpts from the PolyFi log file
        - startup traceback or tray/splash behavior notes

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what happened.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps that reliably reproduce the issue.
      placeholder: |
        1. Run ...
        2. Open ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include errors, tray symptoms, or screenshot notes.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: PolyFi: Ranked version
      placeholder: "e.g. 1.0.0-dev.11"
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python version
      placeholder: "e.g. 3.11.9"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Include logs, config snippets with secrets redacted, screenshots, or anything else that may help.
